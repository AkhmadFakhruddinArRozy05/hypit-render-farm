name: Clipper trusted Hypit render
run-name: 'clipper:${{ inputs.job_id }}'

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Persisted Clipper cloud job ID (bounded edit data fetched with GitHub OIDC)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Free-tier MVP: exactly one render at a time. Never cancel a running revision.
concurrency:
  group: clipper-trusted-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLIPPER_API_ORIGIN: ${{ vars.CLIPPER_API_ORIGIN }}
      HYPIT_ROOT: ${{ github.workspace }}/hypit
    steps:
      - name: Checkout trusted farm revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Authorize exact job before provisioning expensive dependencies
        env:
          CLIPPER_JOB_ID: ${{ inputs.job_id }}
        run: python3 scripts/cloud_runner.py --job-id "$CLIPPER_JOB_ID" --preflight-only
      - name: Checkout pinned Hypit engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hypit-ai/hypit
          ref: 1efedb925d375686ab107b6e67f914dced7b102b
          path: hypit
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Pinned pnpm matching Hypit lockfile
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0
      - name: Install technical media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
      - name: Install only pinned engine dependencies
        working-directory: hypit
        run: |
          pnpm install --frozen-lockfile
      - name: Execute exact persisted job and upload private receipts
        env:
          CLIPPER_JOB_ID: ${{ inputs.job_id }}
        run: python3 scripts/cloud_runner.py --job-id "$CLIPPER_JOB_ID"
